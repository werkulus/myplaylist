<style>
/* === THEME LIGHT === */
:root, :root[data-theme="light"] {
  --bg: #F5F5F8; --bg2: #FFF; --bg3: #EEEEF2; --bgE: #FFF;
  --tx: #1A1A2E; --tx2: #5A5A7A; --tx3: #8A8AA0; --txI: #FFF;
  --ac: #00B4D8; --acD: #0077B6; --acL: #90E0EF; --acS: #E0F7FA; --acT: #00363D;
  --err: #F44336; --ok: #4CAF50; --warn: #FF9800; --liked: #FF4081;
  --cBg: #FFF; --cBd: rgba(0,0,0,.06); --cSh: 0 2px 12px rgba(0,0,0,.07);
  --cShH: 0 6px 20px rgba(0,0,0,.1); --cR: 16px; --cRs: 12px;
  --inBg: #F0F0F3; --inBd: #D0D0DA;
  --hdr: linear-gradient(135deg,#0077B6,#00B4D8 50%,#48CAE4);
  --sbBg: #FFF; --sbBd: rgba(0,0,0,.06);
  --chBg: #E8E8F0; --chT: #3A3A5A;
}
:root[data-theme="dark"] {
  --bg: #0F0F1A; --bg2: #1A1A2E; --bg3: #252540; --bgE: #1E1E35;
  --tx: #E8E8F0; --tx2: #A0A0C0; --tx3: #6A6A8A; --txI: #1A1A2E;
  --ac: #00B4D8; --acD: #0096C7; --acL: #48CAE4; --acS: #0A2A3A; --acT: #CAF0F8;
  --err: #EF5350; --ok: #66BB6A; --warn: #FFA726; --liked: #FF4081;
  --cBg: #1A1A2E; --cBd: rgba(255,255,255,.06); --cSh: 0 2px 12px rgba(0,0,0,.3);
  --cShH: 0 6px 20px rgba(0,0,0,.4); --cR: 16px; --cRs: 12px;
  --inBg: #252540; --inBd: #3A3A5A;
  --hdr: linear-gradient(135deg,#0A1628,#0F2A4A 50%,#0077B6);
  --sbBg: #141428; --sbBd: rgba(255,255,255,.06);
  --chBg: #252540; --chT: #C0C0E0;
}
/* === BASE === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);
  line-height:1.5;min-height:100vh;display:flex;flex-direction:column;transition:background .25s,color .25s}
a{color:var(--ac);text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--tx3);border-radius:3px}

/* === HEADER === */
.hdr{background:var(--hdr);color:#fff;padding:14px 20px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;
  box-shadow:0 2px 16px rgba(0,0,0,.15)}
.hdr-logo{font-size:1.35rem;font-weight:700;letter-spacing:-.5px}
.hdr-r{display:flex;gap:6px;align-items:center}
.hdr-btn{background:rgba(255,255,255,.15);color:#fff;padding:7px 11px;border-radius:8px;
  font-size:.82rem;font-weight:500;transition:background .2s}
.hdr-btn:hover{background:rgba(255,255,255,.28)}

/* === LAYOUT === */
.lay{display:flex;flex:1;min-height:0}
.sb{width:200px;background:var(--sbBg);border-right:1px solid var(--sbBd);padding:12px 0;
  flex-shrink:0;overflow-y:auto;transition:background .25s}
.mn{flex:1;padding:20px;overflow-y:auto}

/* === NAV === */
.nv{display:flex;align-items:center;gap:10px;padding:10px 16px;color:var(--tx2);
  font-weight:500;font-size:.9rem;width:100%;text-align:left;transition:all .15s;border-radius:0}
.nv:hover{background:var(--acS);color:var(--ac)}
.nv.on{color:var(--ac);background:var(--acS);border-right:3px solid var(--ac)}
.nv-i{font-size:1.1rem;width:22px;text-align:center}

/* === TOOLBAR === */
.tb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:14px;
  border-bottom:1px solid var(--cBd);margin-bottom:14px}
.sr{flex:1;min-width:180px;padding:9px 16px;border-radius:24px;border:1px solid var(--inBd);
  background:var(--inBg);color:var(--tx);font-size:.9rem;transition:border .2s,box-shadow .2s;outline:none}
.sr:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(0,180,216,.12)}

/* === BUTTONS === */
.btn{padding:7px 14px;border-radius:8px;font-weight:500;font-size:.85rem;
  display:inline-flex;align-items:center;gap:5px;transition:all .15s}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--acD)}
.btn-s{background:var(--chBg);color:var(--tx)}.btn-s:hover{opacity:.8}
.btn-d{background:var(--err);color:#fff}
.btn-sm{padding:5px 10px;font-size:.78rem}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:14px;
  font-size:.78rem;font-weight:500;background:var(--chBg);color:var(--chT);cursor:pointer;transition:all .15s}
.chip.on{background:var(--ac);color:#fff}

/* === SONG ROW === */
.srow{display:flex;gap:10px;padding:10px 12px;align-items:center;background:var(--cBg);
  border:1px solid var(--cBd);border-radius:var(--cRs);margin-bottom:6px;
  transition:box-shadow .15s,transform .15s;cursor:pointer}
.srow:hover{box-shadow:var(--cShH);transform:translateY(-1px)}
.srow-n{width:32px;text-align:right;font-size:.78rem;color:var(--tx3);font-weight:600;flex-shrink:0}
.srow-img{width:48px;height:48px;border-radius:var(--cRs);object-fit:cover;flex-shrink:0;
  background:var(--bg3)}
.srow-info{flex:1;min-width:0}
.srow-t{font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow-a{color:var(--tx2);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow-m{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--tx3);margin-top:1px;flex-wrap:wrap}
.srow-lk{color:var(--liked)}
.srow-yt{padding:4px 10px;border-radius:6px;background:var(--chBg);color:var(--tx);
  font-size:.78rem;font-weight:500;text-decoration:none;flex-shrink:0}
.srow-yt:hover{background:var(--ac);color:#fff}

/* === PAGINATION === */
.pg{display:flex;justify-content:center;align-items:center;gap:8px;padding:20px 0}
.pg-btn{padding:8px 14px;border-radius:8px;background:var(--chBg);color:var(--tx);
  font-weight:500;font-size:.85rem;transition:all .15s}
.pg-btn:hover:not(:disabled){background:var(--ac);color:#fff}
.pg-btn:disabled{opacity:.35;cursor:default}
.pg-info{font-size:.85rem;color:var(--tx2);min-width:120px;text-align:center}

/* === DROPZONE === */
.dz{border:2px dashed var(--inBd);border-radius:var(--cR);padding:32px;text-align:center;
  cursor:pointer;transition:all .2s;background:var(--bg3);margin-bottom:16px}
.dz.over{border-color:var(--ac);background:var(--acS)}
.dz-ic{font-size:2.2rem;margin-bottom:6px}

/* === MODAL === */
.mdl-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;
  align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.mdl-bg.open{opacity:1;pointer-events:auto}
.mdl{background:var(--bgE);border-radius:var(--cR);box-shadow:0 16px 48px rgba(0,0,0,.25);
  max-width:560px;width:92%;max-height:82vh;overflow-y:auto;padding:24px}

/* === TOAST === */
.tst{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:var(--cRs);
  color:#fff;font-weight:500;font-size:.9rem;z-index:300;transform:translateY(80px);
  opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1)}
.tst.show{transform:translateY(0);opacity:1}
.tst-ok{background:var(--ok)}.tst-err{background:var(--err)}.tst-info{background:var(--ac)}

/* === SETTINGS FORM === */
.fg{margin-bottom:14px}
.fg label{display:block;font-weight:500;margin-bottom:4px;font-size:.88rem}
.fi{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--inBd);
  background:var(--inBg);color:var(--tx);outline:none;transition:border .2s}
.fi:focus{border-color:var(--ac)}

/* === EMPTY === */
.empty{text-align:center;padding:50px 16px;color:var(--tx3)}
.empty-ic{font-size:3.5rem;margin-bottom:12px;opacity:.5}

/* === CARD === */
.card{background:var(--cBg);border:1px solid var(--cBd);border-radius:var(--cR);
  box-shadow:var(--cSh);padding:20px;margin-bottom:14px;transition:box-shadow .15s}

/* === FOOTER === */
.ftr{text-align:center;padding:14px;font-size:.78rem;color:var(--tx3);border-top:1px solid var(--cBd)}

/* === HAMBURGER === */
.ham{display:none;color:#fff;font-size:1.4rem;padding:4px}

/* === VIEW MODES === */
.v-grid{display:grid;gap:10px}
.v-list .srow{display:flex}
.v-sm{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.v-md{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.v-lg{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.v-sm .srow,.v-md .srow,.v-lg .srow{flex-direction:column;align-items:stretch;padding:0;overflow:hidden}
.v-sm .srow-n,.v-md .srow-n,.v-lg .srow-n{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);
  color:#fff;padding:1px 6px;border-radius:6px;font-size:.7rem;z-index:1}
.v-sm .srow-img,.v-md .srow-img,.v-lg .srow-img{width:100%;height:auto;aspect-ratio:1;border-radius:0}
.v-sm .srow-info,.v-md .srow-info,.v-lg .srow-info{padding:8px 10px}
.v-sm .srow{position:relative}.v-md .srow{position:relative}.v-lg .srow{position:relative}
.v-sm .srow-yt,.v-md .srow-yt,.v-lg .srow-yt{position:absolute;top:6px;right:6px;
  background:rgba(255,0,0,.85);color:#fff;border-radius:6px;font-size:.72rem;padding:3px 8px;z-index:1}
.v-sm .srow-m{display:none}
/* caption modes */
.cap-artist .srow-m,.cap-artist .srow-t{display:none}
.cap-title .srow-a,.cap-title .srow-m{display:none}
.cap-both .srow-m{display:none}
.cap-full{}

/* === FILTER BAR === */
.fbar{display:flex;gap:5px;flex-wrap:wrap;padding:8px 0;align-items:center}

/* === SECTION === */
.sec-t{font-size:1.15rem;font-weight:700;margin-bottom:14px}

/* === RESPONSIVE === */
@media(max-width:768px){
  .ham{display:block}
  .hdr{padding:10px 14px}
  .lay{flex-direction:column}
  .sb{position:fixed;left:-260px;top:0;bottom:0;width:240px;z-index:150;
    box-shadow:4px 0 20px rgba(0,0,0,.2);transition:left .3s;padding-top:60px}
  .sb.open{left:0}
  .mn{padding:12px}
  .srow-img{width:40px;height:40px}
  .tb{flex-direction:column;align-items:stretch}
  .sr{min-width:unset}
}
@media(max-width:400px){
  .srow-n{width:24px;font-size:.72rem}
  .srow-yt{display:none}
}
</style>

let lang=localStorage.getItem('mp_lang')||'pl';
function t(k,p){let s=L[lang]?.[k]||L.pl[k]||k;if(p)for(const[a,b]of Object.entries(p))s=s.replace(`{${a}}`,b);return s}

/* ========== IndexedDB ========== */
const DB={
  _db:null,_name:'MyPlaylistDB',_ver:1,
  open(){return new Promise((ok,no)=>{
    const r=indexedDB.open(this._name,this._ver);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('songs')){
        const s=db.createObjectStore('songs',{keyPath:'id'});
        s.createIndex('title','title');s.createIndex('artists','artists');
      }
      if(!db.objectStoreNames.contains('categories'))
        db.createObjectStore('categories',{keyPath:'id'});
      if(!db.objectStoreNames.contains('settings'))
        db.createObjectStore('settings',{keyPath:'key'});
    };
    r.onsuccess=e=>{this._db=e.target.result;ok()};
    r.onerror=e=>no(e.target.error);
  })},
  _tx(store,mode='readonly'){return this._db.transaction(store,mode).objectStore(store)},
  async getAll(store){return new Promise((ok,no)=>{const r=this._tx(store).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async get(store,key){return new Promise((ok,no)=>{const r=this._tx(store).get(key);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async put(store,obj){return new Promise((ok,no)=>{const r=this._tx(store,'readwrite').put(obj);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})},
  async putMany(store,items){return new Promise((ok,no)=>{
    const tx=this._db.transaction(store,'readwrite');const s=tx.objectStore(store);
    for(const it of items)s.put(it);
    tx.oncomplete=()=>ok();tx.onerror=()=>no(tx.error);
  })},
  async del(store,key){return new Promise((ok,no)=>{const r=this._tx(store,'readwrite').delete(key);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})},
  async clear(store){return new Promise((ok,no)=>{const r=this._tx(store,'readwrite').clear();r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})},
  async count(store){return new Promise((ok,no)=>{const r=this._tx(store).count();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})},
  async getSetting(k){const r=await this.get('settings',k);return r?.value},
  async setSetting(k,v){await this.put('settings',{key:k,value:v})},
};

/* ========== CSV PARSER ========== */
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const lines=[],R=[];let cur=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){if(q&&text[i+1]==='"'){f+='"';i++}else q=!q}
    else if(c===','&&!q){cur.push(f);f=''}
    else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;cur.push(f);f='';if(cur.some(x=>x.trim()))lines.push(cur);cur=[]}
    else f+=c;
  }
  cur.push(f);if(cur.some(x=>x.trim()))lines.push(cur);
  if(lines.length<2)return[];
  const hdr=lines[0].map(h=>h.trim().toLowerCase().replace(/[^a-z0-9_]/g,''));
  const hasVideoId=hdr.includes('video_id');
  const gi=k=>hdr.indexOf(k);
  for(let i=1;i<lines.length;i++){
    const r=lines[i],g=(k)=>{const x=gi(k);return x>=0&&x<r.length?r[x].trim():''};
    if(hasVideoId){
      const id=g('video_id');if(!id)continue;
      const thumb=g('thumbnail_url')||null;
      R.push({
        id, title:g('title'), artists:g('artists'), album:g('album'),
        duration:parseInt(g('duration_sec'))||null, liked:g('liked')==='1',
        playTimeMs:parseInt(g('play_time_ms'))||0,
        sources:g('sources').split(';').map(s=>s.trim()).filter(Boolean),
        originalPlaylists:g('playlists').split(';').map(s=>s.trim()).filter(Boolean),
        thumbnailUrl:thumb,
        ytUrl:g('yt_music_url')||`https://music.youtube.com/watch?v=${id}`,
        tags:[],categories:[],genre:null,links:{},lyrics:null,addedAt:new Date().toISOString()
      });
    } else {
      // Simple format: artist,title (Metrolist export)
      const artist=r[0]?.trim()||'';
      const title=r[1]?.trim()||'';
      if(!title)continue;
      R.push({
        id:'csv_'+Date.now()+'_'+i,title,artists:artist,album:'',
        duration:null,liked:false,playTimeMs:0,sources:['csv_import'],
        originalPlaylists:[],thumbnailUrl:null,
        ytUrl:'',tags:[],categories:[],genre:null,links:{},lyrics:null,
        addedAt:new Date().toISOString()
      });
    }
  }
  return R;
}

  async _renderFilterBar(){

    html+=`<button class="chip ${this._filterLiked?'on':''}" onclick="App._toggleLiked()">❤️ ${t('liked')} (${likedCount})</button>`;
    html+=`<button class="chip ${this._filterNoCat?'on':''}" onclick="App._toggleNoCat()">📭 ${lang==='pl'?'Bez kategorii':'Uncategorized'} (${noCatCount})</button>`;

  _clearFilters(){this._filterCat=null;this._filterLiked=false;this._filterNoCat=false;this._page=1;this._loadPage()},

  _toggleNoCat(){this._filterNoCat=!this._filterNoCat;this._filterCat=null;this._filterLiked=false;this._page=1;this._loadPage()},
  _setCatFilter(id){this._filterCat=id;this._filterLiked=false;this._filterNoCat=false;this._page=1;this._loadPage()},

  async _loadPage(){
    let songs=await DB.getAll('songs');
    const cats=await DB.getAll('categories');
    const catMap=new Map(cats.map(c=>[c.id,c.name]));
    // Category filter
    if(this._filterCat){
      songs=songs.filter(s=>(s.categories||[]).includes(this._filterCat));
    }
    // Liked filter
    if(this._filterLiked){
      songs=songs.filter(s=>s.liked);
    }
    // Uncategorized filter
    if(this._filterNoCat){
      songs=songs.filter(s=>!s.categories||s.categories.length===0);
    }
    // Search (title, artist, album, category names)
    if(this._search){
      const q=this._search.toLowerCase();
      songs=songs.filter(s=>{
        if((s.title||'').toLowerCase().includes(q))return true;
        if((s.artists||'').toLowerCase().includes(q))return true;
        if((s.album||'').toLowerCase().includes(q))return true;
        const songCatNames=(s.categories||[]).map(cid=>catMap.get(cid)||'').join(' ').toLowerCase();
        if(songCatNames.includes(q))return true;
        return false;
      });
    }
    // Sort
    const sk=this._sort;
    songs.sort((a,b)=>{
      if(sk==='playTimeMs')return(b.playTimeMs||0)-(a.playTimeMs||0);
      return(a[sk]||'').localeCompare(b[sk]||'');
    });
    this._songs=songs;this._total=songs.length;
    const pages=Math.max(1,Math.ceil(this._total/this._perPage));
    if(this._page>pages)this._page=pages;
    const start=(this._page-1)*this._perPage;
    const slice=songs.slice(start,start+this._perPage);
    const sl=document.getElementById('songList');
    if(!slice.length){sl.innerHTML=`<div class="empty"><div class="empty-ic">🎵</div><div>${t('noSongs')}</div></div>`;document.getElementById('pgn').innerHTML='';return}
    const vm=this._viewMode;
    const viewClass=vm==='list'?'v-list':`v-grid v-${vm}`;
    sl.className=`${viewClass} cap-${this._caption}`;
    sl.innerHTML=slice.map((s,i)=>{
      const num=start+i+1;
      const dur=s.duration?`${Math.floor(s.duration/60)}:${String(s.duration%60).padStart(2,'0')}`:'';
      const src=(s.sources||[]).join(', ');
      const thumb=s.thumbnailUrl||null;
      const imgHtml=thumb
        ?`<img class="srow-img" data-src="${this._esc(thumb)}" alt="" loading="lazy">`
        :`<div class="srow-img" style="display:flex;align-items:center;justify-content:center;font-size:1.2rem">🎵</div>`;
      const songCatChips=(s.categories||[]).map(cid=>{const c=cats.find(x=>x.id===cid);return c?`<span class="chip" style="font-size:.68rem;padding:1px 6px;background:${c.color};color:#fff">${this._esc(c.name)}</span>`:''}).filter(Boolean).join('');
      return`<div class="srow" data-id="${s.id}">
        <span class="srow-n">${num}</span>
        ${imgHtml}
        <div class="srow-info">
          <div class="srow-t">${this._esc(s.title)}</div>
          <div class="srow-a">${this._esc(s.artists||'—')}</div>
          <div class="srow-m">
            ${s.liked?'<span class="srow-lk">❤️</span>':''}
            ${dur?`<span>${dur}</span>`:''}
            ${s.album?`<span>· ${this._esc(s.album)}</span>`:''}
            ${src?`<span>· ${src}</span>`:''}
          </div>
          ${songCatChips?`<div style="margin-top:3px;display:flex;gap:3px;flex-wrap:wrap">${songCatChips}</div>`:''}
        </div>
        <a href="${s.ytUrl||`https://music.youtube.com/watch?v=${s.id}`}" target="_blank" rel="noopener" class="srow-yt" onclick="event.stopPropagation()">▶ YT</a>
      </div>`}).join('');
    // Lazy load images
    this._lazyLoad();
    // Render category filter bar
    this._renderFilterBar();
    // Click to open detail
    sl.querySelectorAll('.srow').forEach(row=>row.onclick=()=>this._openDetail(row.dataset.id));
    // Pagination
    document.getElementById('pgn').innerHTML=`
      <button class="pg-btn" onclick="App._goPg(-1)" ${this._page<=1?'disabled':''}>${t('prev')}</button>
      <span class="pg-info">${t('page')} ${this._page} ${t('of')} ${pages} (${this._total})</span>
      <button class="pg-btn" onclick="App._goPg(1)" ${this._page>=pages?'disabled':''}>${t('next')}</button>`;
  },

  _goPg(d){this._page+=d;this._loadPage()},

  _lazyLoad(){
    const imgs=document.querySelectorAll('.srow-img[data-src]');
    if(!imgs.length)return;
    const obs=new IntersectionObserver((entries,o)=>{
      entries.forEach(e=>{if(e.isIntersecting){
        const img=e.target;img.src=img.dataset.src;
        img.onerror=()=>{img.replaceWith(Object.assign(document.createElement('div'),{className:'srow-img',style:'display:flex;align-items:center;justify-content:center;font-size:1.2rem',textContent:'🎵'}))};
        img.removeAttribute('data-src');o.unobserve(img)}})
    },{rootMargin:'200px'});
    imgs.forEach(img=>obs.observe(img));
  },

  /* ---- FILE IMPORT ---- */
  async _handleFile(file){
    const text=await file.text();
    try{
      let songs;
      if(file.name.endsWith('.json')){
        const data=JSON.parse(text);
        if(data.songs){songs=data.songs;if(data.categories)await DB.putMany('categories',data.categories)}
        else throw new Error('Invalid JSON');
      }else{songs=parseCSV(text)}
      if(!songs?.length){this._toast('No songs found','err');return}
      // Custom source label from input
      const customSource=(document.getElementById('impSource')?.value||'').trim();
      if(customSource){
        for(const s of songs){
          if(!s.sources)s.sources=[];
          if(!s.sources.includes(customSource))s.sources.push(customSource);
        }
      }
      // Auto-create categories from playlists
      const cats=await DB.getAll('categories');
      const catMap=new Map(cats.map(c=>[c.name,c.id]));
      for(const s of songs){
        for(const pl of(s.originalPlaylists||[])){
          if(pl&&!catMap.has(pl)){
            const id='cat_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
            await DB.put('categories',{id,name:pl,color:'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')});
            catMap.set(pl,id);
          }
          if(pl&&catMap.has(pl)){
            if(!s.categories)s.categories=[];
            if(!s.categories.includes(catMap.get(pl)))s.categories.push(catMap.get(pl));
          }
        }
      }
      // Merge with existing
      let added=0,merged=0;
      for(const s of songs){
        const existing=await DB.get('songs',s.id);
        if(existing){
          existing.artists=existing.artists||s.artists;
          existing.album=existing.album||s.album;
          existing.duration=existing.duration||s.duration;
          existing.liked=existing.liked||s.liked;
          existing.playTimeMs=Math.max(existing.playTimeMs||0,s.playTimeMs||0);
          existing.sources=[...new Set([...(existing.sources||[]),...(s.sources||[])])];
          existing.originalPlaylists=[...new Set([...(existing.originalPlaylists||[]),...(s.originalPlaylists||[])])];
          existing.categories=[...new Set([...(existing.categories||[]),...(s.categories||[])])];
          await DB.put('songs',existing);merged++;
        }else{await DB.put('songs',s);added++}
      }
      let msg=t('imported',{n:added});
      if(merged)msg+=` · ${t('merged',{n:merged})}`;
      this._toast(msg,'ok');
      await this._refreshStats();
      await this._loadPage();
    }catch(e){this._toast('Error: '+e.message,'err')}
  },

              <div style="font-size:.82rem;color:var(--tx3)">${t('catSongs',{n:cnt})}</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              <button class="btn btn-sm btn-p" onclick="App._filterCatFromView('${c.id}')">${lang==='pl'?'Pokaż':'Show'}</button>
              <button class="btn btn-sm btn-s" onclick="App._delCat('${c.id}')">${t('del')}</button>
            </div>
          </div>`}).join('')}</div>`;
  },
  async _addNewCat(){
    const n=document.getElementById('newCatN')?.value?.trim();
    const c=document.getElementById('newCatC')?.value||'#00B4D8';
    if(!n)return;
    await DB.put('categories',{id:'cat_'+Date.now(),name:n,color:c});
    this._renderCat();this._toast(n+' ✓','ok');
  },
  async _delCat(id){
    await DB.del('categories',id);
    const songs=await DB.getAll('songs');
    for(const s of songs){
      if(s.categories?.includes(id)){s.categories=s.categories.filter(c=>c!==id);await DB.put('songs',s)}
    }
    this._renderCat();
  },

  _filterCatFromView(id){this._filterCat=id;this._filterLiked=false;this._filterNoCat=false;this._page=1;this.nav('lib')},

  /* ---- SETTINGS ---- */
  _renderSet(){
    document.getElementById('mn').innerHTML=`<div class="sec-t">${t('settings')}</div>
      <div class="card"><h3>${t('ghSync')}</h3><form autocomplete="off" onsubmit="return false">
        <div class="fg" style="margin-top:10px"><label>${t('ghRepo')}</label><input class="fi" id="sGhR" placeholder="user/myplaylist" autocomplete="off"></div>
        <div class="fg"><label>${t('ghToken')}</label><input class="fi" id="sGhT" type="password" placeholder="ghp_..." autocomplete="off"></div>
        <div class="fg"><label>${t('ghPwd')}</label><input class="fi" id="sGhP" type="password" placeholder="..." autocomplete="off"></div>
        <div style="display:flex;gap:6px"><button type="button" class="btn btn-s" onclick="App._ghPull()">${t('ghPull')}</button>
          <button type="button" class="btn btn-p" onclick="App._ghPush()">${t('ghPush')}</button></div>
      </form></div>
      <div class="card" style="border-color:var(--err)"><h3 style="color:var(--err)">${t('danger')}</h3>
        <div style="margin-top:10px;display:flex;gap:6px">
          <button class="btn btn-d btn-sm" onclick="App._clearAll()">${t('clearLib')}</button>
          <button class="btn btn-d btn-sm" onclick="App._resetAll()">${t('resetAll')}</button>
        </div>
      </div>`;
    // Load saved settings
    DB.getSetting('ghRepo').then(v=>{if(v)document.getElementById('sGhR').value=v});
    DB.getSetting('ghToken').then(v=>{if(v)document.getElementById('sGhT').value=v});
    DB.getSetting('ghPwd').then(v=>{if(v)document.getElementById('sGhP').value=v});
  },

  async _ghPush(){
    const repo=document.getElementById('sGhR')?.value;
    const token=document.getElementById('sGhT')?.value;
    const pwd=document.getElementById('sGhP')?.value;
    if(!repo||!token){this._toast('Fill repo & token','err');return}
    await DB.setSetting('ghRepo',repo);await DB.setSetting('ghToken',token);
    if(pwd)await DB.setSetting('ghPwd',pwd);
    try{
      const songs=await DB.getAll('songs');const categories=await DB.getAll('categories');
      let content=JSON.stringify({version:'2.0',exportDate:new Date().toISOString(),songs,categories});
      if(pwd)content=await this._encrypt(content,pwd);
      const b64=btoa(unescape(encodeURIComponent(typeof content==='string'?content:'')));
      const file=pwd?'library.enc':'library.json';
      // Check existing
      const url=`https://api.github.com/repos/${repo}/contents/${file}`;
      let sha=null;
      try{const r=await fetch(url,{headers:{'Authorization':`token ${token}`}});if(r.ok)sha=(await r.json()).sha}catch{}
      const body={message:`MyPlaylist sync ${new Date().toISOString()}`,content:pwd?await this._arrayBufToBase64(content):b64};
      if(sha)body.sha=sha;
      const r=await fetch(url,{method:'PUT',headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok)throw new Error(`${r.status}`);
      this._toast('GitHub push ✓','ok');
    }catch(e){this._toast('GitHub error: '+e.message,'err')}
  },

  async _ghPull(){
    const repo=document.getElementById('sGhR')?.value||await DB.getSetting('ghRepo');
    const token=document.getElementById('sGhT')?.value||await DB.getSetting('ghToken');
    const pwd=document.getElementById('sGhP')?.value||await DB.getSetting('ghPwd');
    if(!repo||!token){this._toast('Fill repo & token','err');return}
    await DB.setSetting('ghRepo',repo);await DB.setSetting('ghToken',token);
    try{
      const file=pwd?'library.enc':'library.json';
      const url=`https://api.github.com/repos/${repo}/contents/${file}`;
      const r=await fetch(url,{headers:{'Authorization':`token ${token}`,'Accept':'application/vnd.github.v3+json'}});
      if(!r.ok)throw new Error(`${r.status}`);
      const json=await r.json();
      let content;
      if(pwd){content=await this._decrypt(this._base64ToArrayBuf(json.content.replace(/\n/g,'')),pwd)}
      else{content=atob(json.content.replace(/\n/g,''))}
      const data=JSON.parse(content);
      if(data.songs)await DB.putMany('songs',data.songs);
      if(data.categories)await DB.putMany('categories',data.categories);
      await this._refreshStats();
      this._toast(`GitHub pull: ${data.songs?.length||0} songs`,'ok');
      if(this._view==='lib')await this._loadPage();
    }catch(e){this._toast('GitHub error: '+e.message,'err')}
  },

  /* ---- ENCRYPTION (Web Crypto AES-256-GCM) ---- */
  async _encrypt(text,password){
    const enc=new TextEncoder();const salt=crypto.getRandomValues(new Uint8Array(16));
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const km=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(text));
    const result=new Uint8Array(16+12+ct.byteLength);
    result.set(salt,0);result.set(iv,16);result.set(new Uint8Array(ct),28);
    return result.buffer;
  },
  async _decrypt(buf,password){
    const enc=new TextEncoder();const data=new Uint8Array(buf);
    const salt=data.slice(0,16);const iv=data.slice(16,28);const ct=data.slice(28);
    const km=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
    return new TextDecoder().decode(pt);
  },
  async _arrayBufToBase64(buf){const bytes=new Uint8Array(buf);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)},
  _base64ToArrayBuf(b64){const bin=atob(b64);const buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf.buffer},

  /* ---- FAQ ---- */
  _renderFaq(){
    const qs=['q1','q2','q3','q4'];
    document.getElementById('mn').innerHTML=`<div class="sec-t">${t('faqTitle')}</div>`+
      qs.map(q=>`<div class="card"><strong>${t(q)}</strong><p style="color:var(--tx2);margin-top:4px;font-size:.9rem">${t(q.replace('q','a'))}</p></div>`).join('');
  },

  /* ---- CLEAR / RESET ---- */
  async _clearAll(){if(confirm(t('clearQ'))){await DB.clear('songs');await this._refreshStats();this.nav('lib');this._toast(t('clearOK'),'ok')}},
  async _resetAll(){if(confirm(t('resetQ'))){await DB.clear('songs');await DB.clear('categories');await DB.clear('settings');location.reload()}},

  /* ---- THEME / LANG ---- */
  _toggleTheme(){
    const c=document.documentElement.dataset.theme;const n=c==='light'?'dark':'light';
    document.documentElement.dataset.theme=n;DB.setSetting('theme',n);this._updateThemeBtn();
  },
  _updateThemeBtn(){document.getElementById('themeBtn').textContent=document.documentElement.dataset.theme==='light'?'🌙':'☀️'},
  async _toggleLang(){
    lang=lang==='pl'?'en':'pl';localStorage.setItem('mp_lang',lang);await DB.setSetting('lang',lang);
    this._updateLangBtn();this.nav(this._view);
    document.getElementById('appTitle').textContent=t('title');
    document.querySelector('.ftr').firstChild.textContent=t('title');
    document.querySelectorAll('.nv-tx').forEach((el,i)=>{el.textContent=[t('libTab'),t('catTab'),t('setTab'),t('faqTab')][i]});
    document.querySelector('.i-songs').textContent=t('songs');
    document.querySelector('.i-liked').textContent=t('liked');
  },
  _updateLangBtn(){document.getElementById('langBtn').textContent=`🌐 ${lang.toUpperCase()}`},

  /* ---- STATS ---- */
  async _refreshStats(){
    const songs=await DB.getAll('songs');
    document.getElementById('stTotal').textContent=songs.length;
    document.getElementById('stLiked').textContent=songs.filter(s=>s.liked).length;
    const noCat=songs.filter(s=>!s.categories||s.categories.length===0).length;
    const el=document.getElementById('stNoCat');if(el)el.textContent=noCat;
  },

  /* ---- HELPERS ---- */
  _esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML},
  _cf(v){if(!v)return'""';return`"${String(v).replace(/"/g,'""')}"`},
  _dl(content,name,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=name;a.click();URL.revokeObjectURL(a.href)},
  _toast(msg,type='info'){const t=document.getElementById('tst');t.className=`tst tst-${type} show`;t.textContent=msg;clearTimeout(this._tt);this._tt=setTimeout(()=>t.classList.remove('show'),3500)},
};

App.init();
</script>
